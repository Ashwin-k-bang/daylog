<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<title>Home</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #eef1f5;
    --ink: #14181f;
    --muted: #5b6573;
    --line: #cfd6df;
    --daylog: #2f6fdb;
    --money: #1f8a5b;
    --revise: #d9822b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f;
      --ink: #eef1f5;
      --muted: #9aa5b4;
      --line: #2b323d;
      --daylog: #6a9bf0;
      --money: #4fc08d;
      --revise: #f0a456;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 560px; }
  h1 {
    font-size: clamp(2rem, 8vw, 2.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 12px 0 28px;
  }
  .list { display: grid; gap: 14px; }
  a.tile {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 22px 22px 22px 24px;
    border: 1px solid var(--line);
    border-left: 8px solid var(--c);
    border-radius: 6px;
    background: transparent;
  }
  a.tile:active { background: color-mix(in srgb, var(--c) 14%, transparent); }
  a.tile:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
  .name { font-size: 1.5rem; font-weight: 650; color: var(--c); }
  .desc { margin-top: 4px; color: var(--muted); font-size: 1rem; line-height: 1.4; }
  #daylog { --c: var(--daylog); }
  #money { --c: var(--money); }
  #revise { --c: var(--revise); }
</style>
</head>
<body>
<main>
  <h1>Ash’s apps</h1>
  <div class="list">
    <a class="tile" id="daylog" href="./">
      <div class="name">Daylog</div>
      <div class="desc">Log your day with voice and timers.</div>
    </a>
    <a class="tile" id="money" href="money.html">
      <div class="name">Money</div>
      <div class="desc">Track your spending.</div>
    </a>
    <a class="tile" id="revise" href="revise.html">
      <div class="name">Revise</div>
      <div class="desc">See which topics need revising.</div>
    </a>
  </div>
</main>
</body>
</html>
