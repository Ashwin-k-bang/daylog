<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Home</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #050505;
    --ink: #F7EDD0;
    --muted: #A8996F;
    --line: #2C2512;
    --daylog: #FFB800;
    --money: #E8590C;
    --revise: #FFD84D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 560px; }
  h1 {
    font-size: clamp(2rem, 8vw, 2.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 12px 0 28px;
  }
  .list { display: grid; gap: 14px; }
  a.tile {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 22px 22px 22px 24px;
    border: 1px solid var(--line);
    border-left: 8px solid var(--c);
    border-radius: 6px;
    background: transparent;
  }
  a.tile:active { background: color-mix(in srgb, var(--c) 14%, transparent); }
  a.tile:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
  .name { font-size: 1.5rem; font-weight: 650; color: var(--c); }
  .desc { margin-top: 4px; color: var(--muted); font-size: 1rem; line-height: 1.4; }
  #daylog { --c: var(--daylog); }
  #money { --c: var(--money); }
</style>
</head>
<body>
<main>
  <h1>Ash’s apps</h1>
  <div class="list">
    <a class="tile" id="daylog" href="daylog.html">
      <div class="name">Daylog</div>
      <div class="desc">Log your day with voice and timers.</div>
    </a>
    <a class="tile" id="money" href="money.html">
      <div class="name">Money</div>
      <div class="desc">Track your spending.</div>
    </a>
  </div>
</main>
</body>
</html>
