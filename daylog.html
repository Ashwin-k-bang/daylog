<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daylog</title>
<style>
/* ===== THEME TOKENS: edit colors here ===== */
:root{--bg:#EEF1EF;--card:#fff;--ink:#17302D;--mute:#667A77;--line:#D9E0DD;--acc:#0F766E;--rec:#E5484D;--r:14px}
:root[data-theme=dark]{--bg:#0E1514;--card:#16201F;--ink:#E4EEEC;--mute:#8CA19E;--line:#263433;--acc:#2DD4BF;--rec:#FF6369}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:20px;margin:0 8px 0 0;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sp{flex:1}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;max-width:1280px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
/* ===== Voice capture ===== */
.cap{text-align:center}
.pair{display:flex;justify-content:center;gap:26px;margin:4px 0 10px}
.pair .note{margin-top:6px}
#mic,#timer{width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:var(--bg);font-size:38px;display:grid;place-items:center;margin:0 auto;transition:background .2s}
#timer{background:var(--ink);font-size:30px}
#mic.on,#timer.on{background:var(--rec);color:#fff}
#mic.on{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 55%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
@media(prefers-reduced-motion:reduce){#mic.on{animation:none}}
#clock{font-size:34px;font-variant-numeric:tabular-nums;font-weight:300}
#live{min-height:48px;max-height:120px;overflow:auto;color:var(--mute);font-size:14px;text-align:left;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.note{font-size:13px;color:var(--mute)}
/* ===== Views ===== */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar h2{margin:0 6px;font-size:18px;flex:1;min-width:160px}
.ent{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card));border-radius:8px;margin-bottom:6px;cursor:pointer}
.ent small{color:var(--mute);display:block}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week>div{min-width:0}
.week h4,.mb h4{margin:0 0 6px;font-size:13px}
.week .ent{display:block;font-size:12px;padding:5px 6px}
.week .ent b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){.week{grid-template-columns:1fr}}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--mute);text-align:center}
.day{min-height:68px;text-align:left;padding:5px;border-radius:8px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.day.out{visibility:hidden}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.day small{color:var(--mute);font-size:11px}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.hc{aspect-ratio:1;padding:0;border-radius:3px;border-color:transparent;background:color-mix(in srgb,var(--ink) 7%,var(--card))}
.hc.l1{background:color-mix(in srgb,var(--acc) 25%,var(--card))}
.hc.l2{background:color-mix(in srgb,var(--acc) 50%,var(--card))}
.hc.l3{background:color-mix(in srgb,var(--acc) 75%,var(--card))}
.hc.l4{background:var(--acc)}
.hm i{aspect-ratio:1}
/* ===== Time grid (day and week views) ===== */
.tg{border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.tgh,.tgi{display:grid;grid-template-columns:48px repeat(var(--n),1fr);min-width:calc(48px + var(--n)*86px)}
.tgh{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.tgh a{text-align:center;padding:6px 2px;color:var(--mute);text-decoration:none;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;font-size:12px}
.tgh a b{font-size:22px;font-weight:400;color:var(--ink);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.tgh a.tdy b{background:var(--acc);color:var(--bg)}
.tgh a small{min-height:15px}
.tgb{max-height:640px;overflow-y:auto}
.tgi{position:relative}
.gut div{height:48px;font-size:11px;color:var(--mute);text-align:right;padding-right:6px;transform:translateY(-7px)}
.col{position:relative;height:1152px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px)}
.blk{position:absolute;border-radius:6px;padding:2px 6px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;color:#fff;background:color-mix(in srgb,var(--c) 65%,#000);border:1px solid var(--card)}
.blk b{font-weight:600}
.blk.sh{white-space:nowrap;text-overflow:ellipsis}
.now{position:absolute;left:0;right:0;height:2px;background:var(--rec);z-index:1}
/* ===== Summary ===== */
.sum .line{display:grid;grid-template-columns:90px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.sum .track{height:10px;background:color-mix(in srgb,var(--ink) 8%,var(--card));border-radius:6px;overflow:hidden}
.sum .track i{display:block;height:100%;background:var(--c)}
.stats{display:flex;gap:20px;margin-bottom:6px;flex-wrap:wrap}
.stats b{font-size:22px;display:block}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);width:min(420px,94vw)}
dialog::backdrop{background:#0008}
dialog label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
dialog input,dialog select{width:100%}
.err{color:var(--rec);font-size:13px;min-height:18px}
</style>
</head>
<body>
<header>
  <h1>Daylog</h1>
  <span class="sp"></span>
  <button id="exJ">Export JSON</button><button id="exC">Export CSV</button>
  <button id="imp">Import</button><input type="file" id="impF" accept=".json,.csv" hidden>
  <button id="theme" aria-label="Toggle light or dark mode">Theme</button>
</header>

<main>
  <div class="stack">
    <section class="card cap">
      <div class="pair">
        <div><button id="mic" aria-label="Dictate the session title">&#127908;</button><div class="note">Speak title</div></div>
        <div><button id="timer" aria-label="Start or stop the session timer">&#9201;</button><div class="note" id="tLabel">Start timer</div></div>
      </div>
      <div id="clock">00:00:00</div>
      <input id="typed" placeholder="Session title (speak it or type it)" style="width:100%;margin-top:8px">
      <div id="live" aria-live="polite">Tap the mic and say what you're doing. Tap the clock button to start timing.</div>
      <div class="row" style="margin-top:8px">
        <select id="lang">
          <option value="en-IN">English (India)</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option>
          <option value="hi-IN">Hindi</option><option value="mr-IN">Marathi</option><option value="es-ES">Spanish</option><option value="fr-FR">French</option><option value="de-DE">German</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px"><select id="eng" aria-label="Voice engine"><option value="local">Whisper on-device (fast)</option><option value="groq">Whisper cloud (Groq)</option><option value="browser">Browser built-in (live)</option></select></div>
      <input id="gkey" type="password" placeholder="Groq API key (console.groq.com/keys)" style="width:100%;margin-top:8px;display:none">
      <p class="note" id="srNote">Voice works best in Chrome or Edge, over HTTPS or localhost.</p>
    </section>
    <section class="card">
      <div class="row"><button class="pri" id="add">+ Add entry</button><button id="addCat">+ Category</button></div>
      <h3 style="margin:14px 0 8px;font-size:15px">Search and filter</h3>
      <input id="q" placeholder="Search titles" style="width:100%;margin-bottom:8px">
      <div class="row"><select id="fc"></select><button id="clr">Clear</button></div>
      <div class="row" style="margin-top:8px"><input type="date" id="f1" aria-label="From date"><input type="date" id="f2" aria-label="To date"></div>
    </section>
  </div>

  <div class="stack">
    <section class="card">
      <div class="bar">
        <button id="prev" aria-label="Previous">&lsaquo;</button><button id="today">Today</button><button id="next" aria-label="Next">&rsaquo;</button>
        <h2 id="label"></h2>
        <input type="date" id="jump" aria-label="Jump to date">
        <select id="viewSel" aria-label="Calendar view" style="border-radius:99px;font-weight:600;flex:0 0 auto">
          <option value="day">Day (D)</option><option value="week">Week (W)</option><option value="month">Month (M)</option><option value="half">6 months (H)</option><option value="year">Year (Y)</option>
        </select>
      </div>
      <div id="view"></div>
    </section>
    <section class="card sum" id="sum"></section>
  </div>
</main>

<dialog id="dlg">
  <form id="form">
    <h3 id="dTitle" style="margin:0">Entry</h3>
    <label>Title<input id="eT" required></label>
    <label>Date<input type="date" id="eD" required></label>
    <div class="row"><label>Start<input type="time" id="eS" required></label><label>End<input type="time" id="eE" required></label></div>
    <div id="eDur" class="note" style="margin-top:6px"></div>
    <label>Category<select id="eC"></select></label>
    <div class="err" id="eErr"></div>
    <div class="row" style="margin-top:6px"><button type="button" id="eDel">Delete</button><button type="button" id="eX">Cancel</button><button class="pri" type="submit">Save</button></div>
  </form>
</dialog>

<script>
/* ===== HELPERS ===== */
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const tmin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const fmt=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock=ms=>{const s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`};

/* ===== STORAGE: IndexedDB for entries, localStorage for small prefs ===== */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('daylog',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('entries',{keyPath:'id'});
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const tx=(mode,f)=>new Promise((res,rej)=>{const t=db.transaction('entries',mode);const o=f(t.objectStore('entries'));
  t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)});
const dbAll=()=>tx('readonly',s=>s.getAll());
const dbPut=e=>tx('readwrite',s=>s.put(e));
const dbPutMany=l=>tx('readwrite',s=>{l.forEach(e=>s.put(e))});
const dbDel=id=>tx('readwrite',s=>s.delete(id));
const PALETTE=['#2F6FED','#8B5CF6','#16A34A','#F59E0B','#E11D8F','#06B6D4','#EA580C','#64748B'];
let cats=JSON.parse(localStorage.getItem('dl-cats')||'null')||{Work:'#2F6FED',Study:'#8B5CF6',Health:'#16A34A',Personal:'#F59E0B',Other:'#64748B'};
const col=n=>cats[n]||'#64748B';
const saveCats=()=>localStorage.setItem('dl-cats',JSON.stringify(cats));

/* ===== STATE ===== */
let entries=[],byDate={},view=localStorage.getItem('dl-view')||'week',cur=new Date();
const tot=k=>(byDate[k]||[]).reduce((a,e)=>a+e.mins,0);
async function refresh(){
  entries=await dbAll();byDate={};
  entries.forEach(e=>{(byDate[e.date]??=[]).push(e);if(!cats[e.cat]){cats[e.cat]=PALETTE[Object.keys(cats).length%8];saveCats()}});
  Object.values(byDate).forEach(l=>l.sort((a,b)=>a.start.localeCompare(b.start)));
  fillCats();render();
}
function fillCats(){
  const opts=Object.keys(cats).map(c=>`<option>${esc(c)}</option>`).join('');
  $('#eC').innerHTML=opts;$('#fc').innerHTML='<option value="">All categories</option>'+opts;
}

/* ===== RANGE / NAVIGATION ===== */
function range(){
  const y=cur.getFullYear(),m=cur.getMonth();
  if(view==='day')return[cur,cur];
  if(view==='week'){const s=addD(cur,-((cur.getDay()+6)%7));return[s,addD(s,6)]}
  if(view==='month')return[new Date(y,m,1),new Date(y,m+1,0)];
  if(view==='half'){const s=m<6?0:6;return[new Date(y,s,1),new Date(y,s+6,0)]}
  return[new Date(y,0,1),new Date(y,12,0)];
}
function step(k){
  if(view==='day')cur=addD(cur,k);else if(view==='week')cur=addD(cur,7*k);
  else{const n={month:1,half:6,year:12}[view]*k;const d=new Date(cur.getFullYear(),cur.getMonth()+n,1);
    d.setDate(Math.min(cur.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));cur=d}
  render();
}
function filtered(){ // search + category + date-range filters
  const q=$('#q').value.trim().toLowerCase(),c=$('#fc').value,a=$('#f1').value,b=$('#f2').value;
  const on=!!(q||c||a||b);
  return{on,list:entries.filter(e=>(!q||e.title.toLowerCase().includes(q))&&(!c||e.cat===c)&&(!a||e.date>=a)&&(!b||e.date<=b))};
}

/* ===== TIME GRID: blocks positioned by start time and sized by duration ===== */
const HH=48; // pixels per hour
const t12=t=>{let[h,m]=t.split(':').map(Number);const a=h<12?'am':'pm';h=h%12||12;return m?`${h}:${pad(m)}${a}`:`${h}${a}`};
function timeGrid(days){
  const n=days.length,today=ymd(new Date());
  const head=`<div class="tgh" style="--n:${n}"><div></div>`+days.map(d=>{const k=ymd(d);
    return `<a href="#" data-d="${k}" class="${k===today?'tdy':''}"><span>${d.toLocaleDateString(undefined,{weekday:'short'})}</span><b>${d.getDate()}</b><small>${tot(k)?fmt(tot(k)):''}</small></a>`}).join('')+'</div>';
  const gut='<div class="gut">'+Array.from({length:24},(_,h)=>`<div>${h?t12(pad(h)+':00'):''}</div>`).join('')+'</div>';
  const cols=days.map(d=>{const k=ymd(d),out=[];let cl=[],cend=0;
    const flush=()=>{const lanes=[];cl.forEach(o=>{let i=lanes.findIndex(x=>x<=o.s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=o.en;o.lane=i});cl.forEach(o=>o.n=lanes.length);out.push(...cl);cl=[]};
    (byDate[k]||[]).forEach(e=>{const s=tmin(e.start);let en=tmin(e.end);if(en<=s)en=Math.min(1440,s+e.mins);
      if(cl.length&&s>=cend)flush();cend=cl.length?Math.max(cend,en):en;cl.push({e,s,en})});flush(); // side-by-side lanes for overlaps
    const blks=out.map(o=>{const h=Math.max((o.en-o.s)/60*HH,18),sh=h<36;
      return `<div class="blk${sh?' sh':''}" data-id="${o.e.id}" title="${esc(o.e.title)}" style="--c:${col(o.e.cat)};top:${o.s/60*HH}px;height:${h-1}px;left:calc(${o.lane/o.n*100}% + 1px);width:calc(${100/o.n}% - 3px)"><b>${esc(o.e.title)}</b>${sh?', '+t12(o.e.start):'<br>'+t12(o.e.start)+' – '+t12(o.e.end)}</div>`}).join('');
    const nw=new Date(),line=k===today?`<div class="now" style="top:${(nw.getHours()*60+nw.getMinutes())/60*HH}px"></div>`:'';
    return `<div class="col">${blks}${line}</div>`}).join('');
  return `<div class="tg">${head}<div class="tgb" id="tgb"><div class="tgi" style="--n:${n}">${gut}${cols}</div></div></div>`;
}

/* ===== RENDER ===== */
const entHTML=e=>`<div class="ent" data-id="${e.id}" style="--c:${col(e.cat)}"><div><b>${esc(e.title)}</b><small>${e.start} to ${e.end}</small></div><div style="text-align:right"><span class="chip">${esc(e.cat)}</span><small>${fmt(e.mins)}</small></div></div>`;
function render(){
  const[s,e]=range(),L=d=>d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  $('#label').textContent={day:cur.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
    week:`${L(s)} to ${L(e)}`,month:cur.toLocaleDateString(undefined,{month:'long',year:'numeric'}),
    half:`${s.toLocaleDateString(undefined,{month:'short'})} to ${e.toLocaleDateString(undefined,{month:'short',year:'numeric'})}`,year:cur.getFullYear()}[view];
  $('#jump').value=ymd(cur);
  $('#viewSel').value=view;localStorage.setItem('dl-view',view);
  const f=filtered(),v=$('#view');
  if(f.on){ // search results replace the calendar view
    const l=[...f.list].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
    v.innerHTML=`<p class="note">${l.length} matching entries</p>`+l.map(x=>`<div class="note" style="margin:8px 0 3px">${x.date}</div>`+entHTML(x)).join('');
    summary(l,'Matching entries');return;
  }
  if(view==='day'||view==='week'){
    const days=view==='day'?[cur]:Array.from({length:7},(_,i)=>addD(s,i));
    v.innerHTML=timeGrid(days);
    const ks=days.map(ymd),st=entries.filter(e=>ks.includes(e.date)).map(e=>tmin(e.start));
    $('#tgb').scrollTop=Math.max(0,(st.length?Math.min(...st):420)/60*HH-24); // scroll to the first entry (or 7am)
  }
  else if(view==='month'){let h='<div class="mgrid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('');
    for(let i=0;i<(s.getDay()+6)%7;i++)h+='<div class="day out"></div>';
    for(let d=1;d<=e.getDate();d++){const dt=new Date(s.getFullYear(),s.getMonth(),d),k=ymd(dt),l=byDate[k]||[];
      h+=`<button class="day${k===ymd(new Date())?' today':''}" data-d="${k}"><span>${d}</span><span class="dots">${l.slice(0,8).map(x=>`<i style="--c:${col(x.cat)}"></i>`).join('')}</span>${l.length?`<small>${fmt(tot(k))}</small>`:''}</button>`}
    v.innerHTML=h+'</div>';}
  else{ // half-year and year: heatmap, one small grid per month
    let h='<div class="yr">';
    for(let m=s.getMonth();m<=e.getMonth();m++){const y=s.getFullYear(),n=new Date(y,m+1,0).getDate();
      h+=`<div class="mb"><h4>${new Date(y,m,1).toLocaleDateString(undefined,{month:'long'})}</h4><div class="hm">`+'<i></i>'.repeat((new Date(y,m,1).getDay()+6)%7);
      for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d)),t=tot(k),l=t===0?0:t<60?1:t<180?2:t<360?3:4;
        h+=`<button class="hc l${l}" data-d="${k}" title="${k}: ${fmt(t)}" aria-label="${k}: ${fmt(t)}"></button>`}
      h+='</div></div>'}
    v.innerHTML=h+'</div>';}
  const sk=s,ek=e;summary(entries.filter(x=>x.date>=ymd(sk)&&x.date<=ymd(ek)),'Summary');
}
function summary(list,title){ // totals + bars per category
  const by={};let t=0;list.forEach(e=>{by[e.cat]=(by[e.cat]||0)+e.mins;t+=e.mins});
  const days=new Set(list.map(e=>e.date)).size,max=Math.max(1,...Object.values(by));
  $('#sum').innerHTML=`<h3 style="margin:0 0 10px;font-size:15px">${title}</h3><div class="stats"><div><b>${fmt(t)}</b>logged</div><div><b>${list.length}</b>entries</div><div><b>${days?fmt(Math.round(t/days)):'0m'}</b>per active day</div></div>`+
    Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,m])=>`<div class="line" style="--c:${col(c)}"><span>${esc(c)}</span><span class="track"><i style="width:${m/max*100}%"></i></span><span>${fmt(m)}</span></div>`).join('');
}

/* ===== ENTRY EDITOR (used for manual add and for editing/correcting voice entries) ===== */
let editing=null;
function openEditor(e){
  editing=e||null;$('#dTitle').textContent=e?'Edit entry':'Add entry';$('#eDel').style.display=e?'':'none';
  $('#eT').value=e?.title||'';$('#eD').value=e?.date||ymd(cur);$('#eS').value=e?.start||'09:00';$('#eE').value=e?.end||'10:00';
  $('#eC').value=e?.cat||'Other';$('#eErr').textContent='';durHint();$('#dlg').showModal();
}
const durHint=()=>{const d=tmin($('#eE').value||'0:0')-tmin($('#eS').value||'0:0');$('#eDur').textContent=d>0?`Duration: ${fmt(d)}`:''};
['eS','eE'].forEach(i=>$('#'+i).addEventListener('input',durHint));
$('#form').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const mins=tmin($('#eE').value)-tmin($('#eS').value);
  if(mins<=0){$('#eErr').textContent='End time must be after the start time.';return}
  const e={id:editing?.id||crypto.randomUUID(),title:$('#eT').value.trim(),date:$('#eD').value,start:$('#eS').value,end:$('#eE').value,mins,cat:$('#eC').value};
  await dbPut(e);$('#dlg').close();cur=parseD(e.date);refresh();
});
$('#eX').onclick=()=>$('#dlg').close();
$('#eDel').onclick=async()=>{if(confirm('Delete this entry?')){await dbDel(editing.id);$('#dlg').close();refresh()}};

/* ===== MIC: dictate text into the title box (does not save anything) ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,listening=false,denied=false,base='',finalText='',lastStart=0,quick=0;
const warn=m=>{$('#srNote').textContent=m;$('#srNote').style.color='var(--rec)'};
if(!SR)warn('Speech recognition is not supported in this browser. Type the title instead. Chrome or Edge work best.');
const MSG={'not-allowed':'Microphone is blocked. Click the lock icon in the address bar, allow the microphone, and reload. If you opened the file directly, run it from localhost or HTTPS instead.',
  'service-not-allowed':'This browser blocks speech recognition here. Use Chrome or Edge over HTTPS or localhost.',
  'network':'Speech recognition needs an internet connection. Brave and some privacy browsers block it.',
  'audio-capture':'No microphone was found.','language-not-supported':'This language is not supported. Pick another one.'};
function startDictation(){
  if(!SR){warn('Speech recognition is not supported in this browser.');return}
  listening=true;denied=false;quick=0;base=$('#typed').value.trim();finalText='';
  $('#mic').classList.add('on');$('#live').textContent='Listening... tap the mic again when you are done.';
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=$('#lang').value;
  rec.onstart=()=>{$('#srNote').style.color='';$('#srNote').textContent='Microphone is on.'};
  rec.onresult=ev=>{let interim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)finalText+=r[0].transcript+' ';else interim+=r[0].transcript}
    $('#typed').value=((base?base+' ':'')+finalText+interim).trim()}; // live text goes straight into the title box
  rec.onerror=ev=>{if(MSG[ev.error]){warn(MSG[ev.error]);if(ev.error!=='network')denied=true}else if(ev.error!=='no-speech'&&ev.error!=='aborted')warn('Speech error: '+ev.error)};
  rec.onend=()=>{ // browsers stop on silence; restart while the mic is on, but give up if it fails repeatedly
    if(!listening||denied)return;
    quick=(Date.now()-lastStart<1500)?quick+1:0;
    if(quick>4){warn('Speech recognition keeps stopping. Type the title instead.');stopDictation();return}
    base=$('#typed').value.trim();finalText=''; // keep what was already written
    setTimeout(()=>{try{lastStart=Date.now();rec.start()}catch(e){}},300)};
  lastStart=Date.now();
  try{rec.start()}catch(e){warn('Could not start speech recognition: '+e.message)}
}
function stopDictation(){
  listening=false;try{rec?.stop()}catch(e){}
  $('#mic').classList.remove('on');$('#live').textContent='Title ready. Edit it if needed.';
}
/* ===== SPEECH ENGINES: on-device Whisper (worker, preloaded), Groq cloud, browser built-in ===== */
const NAMES={hi:'hindi',mr:'marathi',es:'spanish',fr:'french',de:'german'};
let eng=localStorage.getItem('dl-eng')||'local',mr,chunks=[],stream,wk,wKey='',rdy,pend;
// The worker loads the model once at page load and keeps it in memory, so tapping the mic never waits on it.
const WSRC=`
import {pipeline} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';
let p=null,key='';
self.onmessage=async e=>{const m=e.data;
 try{
  if(m.type==='load'){
    if(key!==m.model){p=null;
      p=await pipeline('automatic-speech-recognition',m.model,{device:m.gpu?'webgpu':'wasm',
        dtype:m.gpu?{encoder_model:'fp32',decoder_model_merged:'q4'}:'q8',
        progress_callback:x=>{if(x.status==='progress')self.postMessage({type:'prog',pct:x.progress})}});
      await p(new Float32Array(16000),m.lang?{language:m.lang,task:'transcribe'}:{}); // warm-up pass compiles kernels
      key=m.model}
    self.postMessage({type:'ready'});
  }else if(m.type==='run'){
    const o=await p(m.audio,m.lang?{language:m.lang,task:'transcribe'}:{});
    self.postMessage({type:'done',text:o.text});
  }
 }catch(err){self.postMessage({type:'err',msg:String(err&&err.message||err)})}
};`;
function modelFor(){
  const lc=$('#lang').value.slice(0,2),en=lc==='en',gpu=!!navigator.gpu;
  if(gpu)return{gpu,model:'onnx-community/whisper-base',lang:en?'english':NAMES[lc]};
  return{gpu,model:en?'Xenova/whisper-base.en':'Xenova/whisper-base',lang:en?undefined:NAMES[lc]}; // base + int8: much more accurate than tiny, still quick for short titles
}
function warmup(){
  const m=modelFor(),k=m.model+'|'+m.lang;
  if(!wk){
    wk=new Worker(URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'})),{type:'module'});
    wk.onmessage=e=>{const d=e.data;
      if(d.type==='prog'){$('#srNote').style.color='';$('#srNote').textContent=`Loading speech model... ${Math.round(d.pct||0)}% (one time only)`}
      else if(d.type==='ready'){$('#srNote').textContent='Speech model ready.';rdy?.res()}
      else if(d.type==='done')pend?.res(d.text);
      else if(d.type==='err'){wKey='';rdy?.rej(new Error(d.msg));pend?.rej(new Error(d.msg))}};
    wk.onerror=e=>{wKey='';const er=new Error(e.message||'worker failed');rdy?.rej(er);pend?.rej(er)};
  }
  if(wKey!==k){wKey=k;const p=new Promise((res,rej)=>{rdy={res,rej}});p.catch(()=>{});rdy.p=p;wk.postMessage({type:'load',...m})}
  return rdy.p;
}
async function prep(blob){ // decode, mono 16 kHz, trim silence, normalise volume
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const dec=await ac.decodeAudioData(await blob.arrayBuffer());ac.close();
  const off=new OfflineAudioContext(1,Math.max(1,Math.ceil(dec.duration*16000)),16000);
  const s=off.createBufferSource();s.buffer=dec;s.connect(off.destination);s.start();
  let a=(await off.startRendering()).getChannelData(0);
  let i=0,j=a.length-1;while(i<j&&Math.abs(a[i])<0.01)i++;while(j>i&&Math.abs(a[j])<0.01)j--;
  a=a.slice(Math.max(0,i-1600),Math.min(a.length,j+1600));
  let mx=0;for(const v of a)mx=Math.max(mx,Math.abs(v));
  if(mx>0.01){const g=0.9/mx;a=a.map(v=>v*g)}
  return a;
}
async function viaLocal(blob){
  await warmup();
  const audio=await prep(blob);
  if(audio.length<4000)return''; // under 0.25 s: nothing was said
  return new Promise((res,rej)=>{pend={res,rej};wk.postMessage({type:'run',audio,lang:modelFor().lang})});
}
async function viaGroq(blob){
  const key=$('#gkey').value.trim();if(!key)throw new Error('add your Groq key first');
  const fd=new FormData();fd.append('file',blob,'a.webm');fd.append('model','whisper-large-v3');
  fd.append('language',$('#lang').value.slice(0,2));fd.append('temperature','0');
  fd.append('prompt',Object.keys(cats).join(', ')); // nudges spelling toward your category names
  const r=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+key},body:fd});
  if(!r.ok)throw new Error('Groq error '+r.status);
  return (await r.json()).text||'';
}
const tidy=t=>{t=(t||'').replace(/\[[^\]]*\]|\([^)]*\)/g,' ').replace(/\b(um+|uh+|erm|hmm+)\b[,.]?/gi,' ').replace(/\s+/g,' ').trim();return t?t[0].toUpperCase()+t.slice(1):t};
async function finishRec(){
  const blob=new Blob(chunks,{type:mr.mimeType}),t=performance.now();
  $('#live').textContent='Transcribing...';
  try{
    let text;
    if(eng==='groq'){try{text=await viaGroq(blob)}catch(e){warn('Groq failed ('+e.message+'), using on-device.');text=await viaLocal(blob)}}
    else text=await viaLocal(blob);
    text=tidy(text);const old=$('#typed').value.trim();
    if(text)$('#typed').value=(old?old+' ':'')+text;
    $('#live').textContent=text?`Title ready (${((performance.now()-t)/1000).toFixed(1)}s). Edit it if needed.`:'Heard nothing. Try again.';
  }catch(err){warn('Transcription failed: '+err.message+'. Switch engine or type the title.');$('#live').textContent=''}
}
async function startRec(){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){warn(MSG['not-allowed']);return}
  chunks=[];mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mr.start();
  listening=true;$('#mic').classList.add('on');$('#live').textContent='Listening... tap the mic again when you are done.';
  if(eng==='local')warmup().catch(e=>warn('Speech model failed to load: '+e.message));
}
function stopRec(){
  listening=false;$('#mic').classList.remove('on');stream?.getTracks().forEach(t=>t.stop());
  return new Promise(r=>{mr.onstop=async()=>{await finishRec();r()};try{mr.stop()}catch(e){r()}});
}
const stopAny=()=>eng==='browser'?stopDictation():stopRec();
$('#mic').onclick=()=>listening?stopAny():(eng==='browser'?startDictation():startRec());
const syncEng=()=>{$('#gkey').style.display=eng==='groq'?'':'none';if(eng!=='browser')warmup().catch(e=>warn('Speech model failed to load: '+e.message))};
$('#eng').value=eng;$('#gkey').value=localStorage.getItem('dl-gkey')||'';
$('#eng').onchange=e=>{eng=e.target.value;localStorage.setItem('dl-eng',eng);syncEng()};
$('#gkey').oninput=e=>localStorage.setItem('dl-gkey',e.target.value.trim());
$('#lang').addEventListener('change',()=>{if(eng!=='browser')warmup().catch(()=>{})});
syncEng(); // start loading the model now so the first tap is instant

/* ===== TIMER BUTTON: press once to note the start time, again to save the duration ===== */
let timing=false,t0=0,tick,lock;
function startTimer(){
  timing=true;t0=Date.now();
  $('#timer').classList.add('on');$('#tLabel').textContent='Stop and save';
  $('#live').textContent='Timing started at '+hm(new Date(t0))+'.';
  tick=setInterval(()=>$('#clock').textContent=clock(Date.now()-t0),500); // timestamp based, accurate for hours
  navigator.wakeLock?.request('screen').then(l=>lock=l).catch(()=>{});
}
async function stopTimer(){
  timing=false;clearInterval(tick);lock?.release().catch(()=>{});const en=new Date(); // end time is the tap, not the end of transcription
  if(listening)await stopAny(); // wait for the transcript so the title is not lost
  const s=new Date(t0),title=$('#typed').value.trim()||'Untitled session';
  const e={id:crypto.randomUUID(),title,date:ymd(s),start:hm(s),end:hm(en),mins:Math.max(1,Math.round((en-s)/60000)),cat:'Other'};
  await dbPut(e);
  $('#timer').classList.remove('on');$('#tLabel').textContent='Start timer';
  $('#clock').textContent='00:00:00';$('#typed').value='';
  $('#live').textContent=`Saved "${title}" (${fmt(e.mins)}, ${e.start} to ${e.end}). Click it in the list to edit.`;
  cur=s;refresh();
}
$('#timer').onclick=()=>timing?stopTimer():startTimer();

/* ===== EXPORT / IMPORT ===== */
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()};
$('#exJ').onclick=()=>dl('daylog.json',JSON.stringify(entries,null,1),'application/json');
$('#exC').onclick=()=>dl('daylog.csv','id,date,start,end,minutes,category,title\n'+entries.map(e=>[e.id,e.date,e.start,e.end,e.mins,e.cat,e.title].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
function parseCSV(t){const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows}
$('#imp').onclick=()=>$('#impF').click();
$('#impF').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;const t=await f.text();let list;
  try{
    if(f.name.endsWith('.json'))list=JSON.parse(t);
    else list=parseCSV(t).slice(1).filter(r=>r.length>=7).map(r=>({id:r[0]||crypto.randomUUID(),date:r[1],start:r[2],end:r[3],mins:+r[4],cat:r[5]||'Other',title:r[6]}));
    list=list.filter(e=>e.date&&e.start&&e.end&&e.title).map(e=>({...e,id:e.id||crypto.randomUUID(),mins:e.mins||tmin(e.end)-tmin(e.start),cat:e.cat||'Other'}));
    await dbPutMany(list);alert(`Imported ${list.length} entries.`);refresh();
  }catch(err){alert('Could not read that file.')}
  ev.target.value='';
};

/* ===== WIRING ===== */
$('#viewSel').onchange=e=>{view=e.target.value;render()};
// Keyboard shortcuts like Google Calendar: d w m h y = views, t = today, p / n = previous / next
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea')||$('#dlg').open||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase(),V={d:'day',w:'week',m:'month',h:'half',y:'year'};
  if(V[k]){view=V[k];render()}else if(k==='t'){cur=new Date();render()}else if(k==='p')step(-1);else if(k==='n')step(1);
});
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#today').onclick=()=>{cur=new Date();render()};
$('#jump').onchange=e=>{if(e.target.value){cur=parseD(e.target.value);render()}};
$('#add').onclick=()=>openEditor();
$('#addCat').onclick=()=>{const n=prompt('New category name');if(n&&n.trim()&&!cats[n.trim()]){cats[n.trim()]=PALETTE[Object.keys(cats).length%8];saveCats();fillCats()}};
['q','fc','f1','f2'].forEach(i=>$('#'+i).addEventListener('input',render));
$('#clr').onclick=()=>{['q','fc','f1','f2'].forEach(i=>$('#'+i).value='');render()};
$('#view').onclick=ev=>{ // one handler for every clickable thing in the views
  const ent=ev.target.closest('.ent,.blk'),d=ev.target.closest('[data-d]');
  if(ent)openEditor(entries.find(e=>e.id===ent.dataset.id));
  else if(d){ev.preventDefault();cur=parseD(d.dataset.d);view='day';render()}
};
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('dl-theme',t)};
document.documentElement.dataset.theme=localStorage.getItem('dl-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
window.addEventListener('beforeunload',e=>{if(timing){e.preventDefault();e.returnValue=''}});
openDB().then(refresh);
</script>
