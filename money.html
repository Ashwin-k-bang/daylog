<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Money · Daylog</title>
<style>
:root{--bg:#EEF1EF;--card:#fff;--ink:#17302D;--mute:#667A77;--line:#D9E0DD;--acc:#0F766E;--rec:#E5484D;--in:#16803C;--r:14px}
:root[data-theme=dark]{--bg:#0E1514;--card:#16201F;--ink:#E4EEEC;--mute:#8CA19E;--line:#263433;--acc:#2DD4BF;--rec:#FF6369;--in:#4ADE80}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:0 env(safe-area-inset-right) 40px env(safe-area-inset-left)}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .back{text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
header .back:hover{border-color:var(--acc)}
header h1{font-size:20px;margin:0;letter-spacing:-.02em}
.sp{flex:1}
#syncb{font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink);white-space:nowrap}
#syncb.ok{color:var(--acc)}#syncb.err{color:var(--rec)}
main{max-width:620px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>button{flex:none}
.note{font-size:13px;color:var(--mute)}
.nav input{text-align:center}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:14px}
.tot b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--rec)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600;width:100%;margin-top:8px}
h3{margin:0 0 8px;font-size:16px}
.ent{display:flex;align-items:center;gap:10px;padding:9px 12px;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card));border-radius:8px;margin-bottom:6px}
.ent .m{flex:1;min-width:0;overflow-wrap:anywhere}
.ent b{font-variant-numeric:tabular-nums}
.ent button{padding:2px 9px;color:var(--mute)}
.ent.in{--c:var(--in)}.ent.out{--c:var(--rec)}
.dayb{display:flex;justify-content:space-between;width:100%;text-align:left;margin-bottom:6px}
</style>
</head>
<body>
<header>
  <a class="back" href="./">&larr; Home</a>
  <h1>&#8377; Money</h1>
  <span class="sp"></span>
  <a id="syncb" href="daylog.html#sync">Sync</a>
</header>
<main>
  <section class="card">
    <div class="row nav"><button id="prev" aria-label="Previous day">&lsaquo;</button><input type="date" id="date" aria-label="Day"><button id="next" aria-label="Next day">&rsaquo;</button><button id="today">Today</button></div>
    <div class="tot"><div><b class="in" id="tin">0</b><span class="note">Income</span></div><div><b class="out" id="tout">0</b><span class="note">Spent</span></div><div><b id="tnet">0</b><span class="note">Net</span></div></div>
    <div class="note" id="mo" style="text-align:center;margin-top:12px"></div>
  </section>
  <section class="card">
    <div class="seg"><button id="bOut" class="on">Spent</button><button id="bIn">Income</button></div>
    <div class="row"><input id="amt" type="number" inputmode="decimal" min="0" step="any" placeholder="Amount ₹" aria-label="Amount"><input id="note" placeholder="Note (optional)" aria-label="Note"></div>
    <button class="pri" id="add">Add</button>
  </section>
  <section class="card"><h3>Entries</h3><div id="list"></div></section>
  <section class="card"><h3>Recent days</h3><div id="days"></div></section>
</main>

<script src="sync.js?v=5"></script>
<script>
/* ===== Money log: same GitHub sync design as Daylog (same repo and token settings), saved to data/money.json ===== */
const MS=(()=>{
  let db,rev=0,etag=null,sha=null,remote=[],busy=false,again=false,kt=null,pt=null,st='off',msg='',last=0,pause=0;
  const dataL=[],statL=[],BCm=window.BroadcastChannel?new BroadcastChannel('daylog-money'):null;
  const tabsM=()=>{try{BCm&&BCm.postMessage(1)}catch(e){}};
  const cfg=()=>({...Sync.cfg(),path:'data/money.json'});
  const set=(s,m)=>{st=s;msg=m||'';statL.forEach(f=>f(st,msg))};
  /* local storage (IndexedDB, works offline) */
  const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('daylog-money',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('entries',{keyPath:'id'});
    r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
  const tx=(mode,f)=>new Promise((res,rej)=>{const t=db.transaction('entries',mode);const o=f(t.objectStore('entries'));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)});
  const allRaw=()=>tx('readonly',s=>s.getAll());
  const all=async()=>(await allRaw()).filter(e=>!e.del);
  const putRaw=l=>tx('readwrite',s=>{l.forEach(e=>s.put(e))});
  const putNewer=l=>new Promise((res,rej)=>{let n=0;const t=db.transaction('entries','readwrite'),s=t.objectStore('entries');
    l.forEach(e=>{const g=s.get(e.id);g.onsuccess=()=>{const o=g.result;if(!o||(e.u||0)>(o.u||0)){s.put(e);n++}}});
    t.oncomplete=()=>res(n>0);t.onerror=()=>rej(t.error)});
  const put=e=>{const r=putRaw([{...e,u:Date.now()}]);kick();tabsM();return r};
  const del=id=>{const r=putRaw([{id,del:true,u:Date.now()}]);kick();tabsM();return r};
  /* GitHub */
  const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
  const b64e=s=>{const u=new TextEncoder().encode(s);let o='';for(let i=0;i<u.length;i+=8192)o+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(o)};
  const url=c=>`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`;
  const hdr=(c,x)=>({Accept:'application/vnd.github+json',...(c.token?{Authorization:'Bearer '+c.token}:{}),...x});
  const fail=r=>{
    const e=new Error(r.status===401?'GitHub rejected the token. Make a new one.':
      r.status===403?(r.headers.get('x-ratelimit-remaining')==='0'?(pause=(+r.headers.get('x-ratelimit-reset')||0)*1000||Date.now()+36e5,'GitHub rate limit reached. Retrying later.'):'Token lacks permission. It needs Contents: Read and write on this repo.'):
      r.status===404?'Repo or file not found (check owner and repo name, and that the token covers this repo).':
      r.status===409||r.status===422?'conflict':`GitHub error ${r.status}`);
    e.status=r.status;return e;
  };
  const nEnt=e=>e.del?{id:e.id,del:true,u:e.u||0}:{id:e.id,type:e.type,amount:e.amount,note:e.note||'',date:e.date,u:e.u||0};
  const ser=l=>'{\n"v":1,\n"entries":[\n'+[...l].map(nEnt).sort((a,b)=>a.id<b.id?-1:1).map(e=>JSON.stringify(e)).join(',\n')+'\n]\n}\n';
  function parse(t){
    if(!t.trim())return[];
    let j;try{j=JSON.parse(t)}catch(e){throw new Error('data/money.json is not valid JSON. Sync stopped so nothing gets overwritten.')}
    return Array.isArray(j.entries)?j.entries:[];
  }
  /* newest timestamp wins; on a tie the remote copy wins, so every device converges */
  function merge(a,b){const m=new Map();a.forEach(e=>m.set(e.id,e));b.forEach(e=>{const o=m.get(e.id);if(!o||(e.u||0)>(o.u||0))m.set(e.id,e)});return[...m.values()]}
  async function pull(c){
    const q=c.branch?'?ref='+encodeURIComponent(c.branch):'';
    const r=await fetch(url(c)+q,{headers:hdr(c,etag?{'If-None-Match':etag}:{}),cache:'no-store'});
    if(r.status===304)return{same:true};
    if(r.status===404){etag=null;sha=null;return{doc:[]}}
    if(!r.ok)throw fail(r);
    const j=await r.json();etag=r.headers.get('ETag');sha=j.sha;
    let t=j.content?b64d(j.content):'';
    if(!j.content){const r2=await fetch(url(c)+q,{headers:hdr(c,{Accept:'application/vnd.github.raw+json'}),cache:'no-store'});if(!r2.ok)throw fail(r2);t=await r2.text()}
    return{doc:parse(t)};
  }
  async function push(c,list){
    const body={message:'Money sync '+new Date().toISOString().slice(0,16).replace('T',' '),content:b64e(ser(list))};
    if(sha)body.sha=sha;if(c.branch)body.branch=c.branch;
    const r=await fetch(url(c),{method:'PUT',headers:hdr(c,{'Content-Type':'application/json'}),body:JSON.stringify(body)});
    if(r.status===409||r.status===422)return false;
    if(!r.ok)throw fail(r);
    sha=(await r.json()).content.sha;etag=null;return true;
  }
  async function run(force){
    const c=cfg();
    if(!c.owner||!c.repo){set('off','Sync is not set up.');return}
    if(!navigator.onLine){set('err','Offline. Changes are kept on this device and sync later.');return}
    if(force!==true){if(Date.now()<pause)return;if(!c.token&&Date.now()-last<60000)return}
    if(busy){again=true;return}
    last=Date.now();busy=true;set('busy');let changed=false;
    try{
      for(let i=0;i<4;i++){
        const r0=rev;
        const f=await pull(c);
        if(!f.same)remote=f.doc;
        const local=await allRaw();
        if(rev!==r0)continue;
        const merged=merge(remote,local);
        if(merged.length&&await putNewer(merged.map(nEnt)))changed=true;
        if(rev!==r0)continue;
        if(c.token&&ser(merged)!==ser(remote)){
          if(await push(c,merged)){remote=merged;break}
          etag=null;continue;
        }
        break;
      }
      set(c.token?'ok':'ro',c.token?'':'Read-only. Add a GitHub token to save from this device.');
    }catch(e){set('err',e.message||String(e))}
    finally{busy=false;if(changed){dataL.forEach(f=>f());tabsM()}if(again){again=false;run()}}
  }
  function kick(){rev++;clearTimeout(kt);kt=setTimeout(()=>run(true),900)}
  function start(ms){
    run(true);clearInterval(pt);pt=setInterval(()=>{if(document.visibilityState==='visible')run()},ms||3000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')run()});
    addEventListener('online',()=>run(true));
  }
  if(BCm)BCm.onmessage=()=>dataL.forEach(f=>f());
  return{open,all,put,del,start,on:f=>dataL.push(f),onStatus:f=>{statL.push(f);f(st,msg)}};
})();

/* ===== UI ===== */
document.documentElement.dataset.theme=localStorage.getItem('dl-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
let type='out',day=ymd(new Date()),L=[];
const rs=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN');
const sum=(a,t)=>a.filter(e=>e.type===t).reduce((s,e)=>s+e.amount,0);
function render(){
  $('#date').value=day;
  $('#bOut').classList.toggle('on',type==='out');$('#bIn').classList.toggle('on',type==='in');
  const de=L.filter(e=>e.date===day),i=sum(de,'in'),o=sum(de,'out');
  $('#tin').textContent=rs(i);$('#tout').textContent=rs(o);
  $('#tnet').textContent=rs(i-o);$('#tnet').className=i-o<0?'out':'in';
  const me=L.filter(e=>e.date.slice(0,7)===day.slice(0,7));
  $('#mo').textContent='This month: '+rs(sum(me,'in'))+' in, '+rs(sum(me,'out'))+' spent, net '+rs(sum(me,'in')-sum(me,'out'));
  $('#list').innerHTML=de.length?de.sort((a,b)=>b.u-a.u).map(e=>`<div class="ent ${e.type}"><div class="m">${esc(e.note||(e.type==='in'?'Income':'Spent'))}</div><b class="${e.type}">${e.type==='in'?'+':'−'}${rs(e.amount)}</b><button data-d="${esc(e.id)}" aria-label="Delete entry">×</button></div>`).join(''):'<p class="note">Nothing logged for this day.</p>';
  let h='';for(let k=0;k<14;k++){const d=ymd(addD(new Date(),-k)),x=L.filter(e=>e.date===d),n=sum(x,'in')-sum(x,'out');
    h+=`<button class="dayb" data-g="${d}"><span>${k===0?'Today':parseD(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</span><span class="${n<0?'out':'in'}">${x.length?rs(n):'–'}</span></button>`}
  $('#days').innerHTML=h;
}
async function load(){L=await MS.all();render()}
function add(){
  const amount=parseFloat($('#amt').value);
  if(!(amount>0)){$('#amt').focus();return}
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  MS.put({id,type,amount,note:$('#note').value.trim(),date:day}).then(load);
  $('#amt').value='';$('#note').value='';$('#amt').focus();
}
$('#add').onclick=add;
['#amt','#note'].forEach(s=>$(s).addEventListener('keydown',e=>{if(e.key==='Enter')add()}));
$('#bOut').onclick=()=>{type='out';render()};$('#bIn').onclick=()=>{type='in';render()};
$('#prev').onclick=()=>{day=ymd(addD(parseD(day),-1));render()};
$('#next').onclick=()=>{day=ymd(addD(parseD(day),1));render()};
$('#today').onclick=()=>{day=ymd(new Date());render()};
$('#date').onchange=e=>{if(e.target.value){day=e.target.value;render()}};
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.d&&confirm('Delete this entry?'))MS.del(b.dataset.d).then(load);
  if(b.dataset.g){day=b.dataset.g;render();scrollTo(0,0)}
});
MS.on(load);
MS.onStatus((st,m)=>{const b=$('#syncb');b.className=st;
  b.textContent={ok:'● Synced',busy:'● Syncing...',ro:'Set up sync',off:'Set up sync',err:'⚠ Sync issue'}[st]||'Sync';b.title=m||''});
if(location.protocol.startsWith('http'))navigator.serviceWorker?.register('sw.js').catch(()=>{});
MS.open().then(async()=>{await load();MS.start(3000)});
</script>
</body>
</html>
