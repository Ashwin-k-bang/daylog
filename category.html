<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Category · Daylog</title>
<style>
:root{--bg:#EEF1EF;--card:#fff;--ink:#17302D;--mute:#667A77;--line:#D9E0DD;--acc:#0F766E;--rec:#E5484D;--r:14px}
:root[data-theme=dark]{--bg:#0E1514;--card:#16201F;--ink:#E4EEEC;--mute:#8CA19E;--line:#263433;--acc:#2DD4BF;--rec:#FF6369}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:0 env(safe-area-inset-right) 40px env(safe-area-inset-left)}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .back{text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
header .back:hover{border-color:var(--acc)}
.sp{flex:1}
#syncb{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink)}
#syncb.ok{color:var(--acc)}#syncb.err{color:var(--rec)}
main{max-width:860px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h1{margin:0;font-size:30px;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
h1 i{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.cl{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);text-decoration:none;font-size:14px}
.cl i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.cl.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cl .lv{font-size:11px;font-weight:700;color:var(--rec)}
.live{text-align:center;border:2px solid var(--c)}
.live.idle{border:1px solid var(--line)}
.live .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--rec);border-radius:99px;padding:2px 10px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.live .tag{animation:none}}
.live .name{font-size:24px;font-weight:600;margin:10px 0 2px;overflow-wrap:anywhere}
.live .clk{font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
.note{font-size:13px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats b{font-size:22px;display:block}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.live .clk{font-size:44px}h1{font-size:26px}}
.gh{display:flex;justify-content:space-between;margin:16px 0 6px;font-size:13px;color:var(--mute)}
.ent{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card));border-radius:8px;margin-bottom:6px}
.ent small{color:var(--mute);display:block}
.ent .r{text-align:right;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--acc)}
</style>
</head>
<body>
<header>
  <a class="back" href="./">&larr; Daylog</a>
  <span class="sp"></span>
  <a id="syncb" href="./#sync">Sync</a>
</header>
<main>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h1 id="title"><i></i><span></span></h1><button id="ren" aria-label="Rename this category">&#9998; Rename</button></div>
  <nav class="nav" id="nav" aria-label="Category pages"></nav>
  <section class="card live idle" id="live"></section>
  <section class="card"><div class="stats" id="stats"></div></section>
  <section class="card"><h3 style="margin:0">Logged in this category</h3><div id="list"></div></section>
</main>

<script src="sync.js?v=5"></script>
<script>
let name=new URLSearchParams(location.search).get('c')||'';
const theme=localStorage.getItem('dl-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
document.documentElement.dataset.theme=theme;
let list=[],shown=30;

function header(){
  document.title=(name||'Category')+' · Daylog';
  $('#title').style.setProperty('--c',col(name));
  $('#title span').textContent=name||'Choose a category';
  const r=activeRun();
  $('#nav').innerHTML=Object.keys(cats).map(c=>`<a class="cl${c===name?' on':''}" style="--c:${col(c)}" href="${catUrl(c)}"><i></i>${esc(c)}${r&&r.cat===c?' <span class="lv">LIVE</span>':''}</a>`).join('');
}
function live(){ // the task running right now, with its time, if it belongs to this category
  const r=activeRun(),el=$('#live');
  el.style.setProperty('--c',col(name));
  if(r&&r.cat===name){
    el.className='card live';
    el.innerHTML=`<span class="tag">LIVE</span><div class="name">${esc(r.title||'Untitled session')}</div><div class="clk" id="clk">${clock(Date.now()-r.t0)}</div><div class="note">Started ${hm(new Date(r.t0))}. Stop it from the Daylog page.</div>`;
    document.title=`${clock(Date.now()-r.t0)} · ${name}`;
  }else{
    el.className='card live idle';
    el.innerHTML=`<div class="note" style="font-size:15px">Nothing is being timed in ${esc(name||'this category')} right now.</div>`+
      (r?`<div class="note" style="margin-top:6px">Currently timing "${esc(r.title||'Untitled session')}" in <a href="${catUrl(r.cat)}">${esc(r.cat)}</a>.</div>`:'');
    document.title=(name||'Category')+' · Daylog';
  }
}
function tickLive(){const r=activeRun(),c=$('#clk');if(r&&r.cat===name&&c){c.textContent=clock(Date.now()-r.t0);document.title=`${c.textContent} · ${name}`}}
function render(){
  header();live();
  const today=ymd(new Date()),ws=ymd(addD(new Date(),-((new Date().getDay()+6)%7)));
  const sum=f=>list.filter(f).reduce((a,e)=>a+e.mins,0);
  $('#stats').innerHTML=[['Today',fmt(sum(e=>e.date===today))],['This week',fmt(sum(e=>e.date>=ws))],['All time',fmt(sum(()=>true))],['Sessions',list.length]]
    .map(([k,v])=>`<div><b>${v}</b><span class="note">${k}</span></div>`).join('');
  const days=[...new Set(list.map(e=>e.date))].sort().reverse();
  let h='';
  days.slice(0,shown).forEach(d=>{
    const l=list.filter(e=>e.date===d).sort((a,b)=>b.start.localeCompare(a.start));
    h+=`<div class="gh"><span>${parseD(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span><span>${fmt(l.reduce((a,e)=>a+e.mins,0))}</span></div>`+
      l.map(e=>`<div class="ent" style="--c:${col(e.cat)}"><div><b>${esc(e.title)}</b><small>${e.start} to ${e.end}</small></div><div class="r">${fmt(e.mins)}</div></div>`).join('');
  });
  if(days.length>shown)h+=`<p style="text-align:center"><button id="more">Show older days</button></p>`;
  $('#list').innerHTML=h||'<p class="note">Nothing logged here yet. Start a timer on the Daylog page with this category selected.</p>';
  const m=$('#more');if(m)m.onclick=()=>{shown+=30;render()};
}
$('#ren').onclick=async()=>{
  try{
    if(typeof DL_VER==='undefined'||typeof renameCategory!=='function'){alert('Your browser is still using an old cached copy of the app. Close this tab, reopen the site, and hard refresh (Ctrl+Shift+R, or clear the site data on your phone).');return}
    if(!name){alert('Open a category first.');return}
    const n=prompt('Rename category',name);if(n===null)return;
    const nn=n.trim();if(!nn||nn===name)return;
    const err=await renameCategory(name,nn);if(err){alert(err);return}
    name=nn;history.replaceState(null,'',catUrl(name));await load();
  }catch(e){alert('Rename failed: '+(e&&e.message||e))}};
async function load(){list=(await dbAll()).filter(e=>e.cat===name);render()}

Sync.on(load);
Sync.onStatus((st,m)=>{const b=$('#syncb');b.className=st;
  b.textContent={ok:'● Synced',busy:'● Syncing...',ro:'Set up sync',off:'Set up sync',err:'⚠ Sync issue'}[st]||'Sync';b.title=m||''});
addEventListener('storage',e=>{if(e.key==='dl-run')live()});
setInterval(tickLive,500);
openDB().then(async()=>{await load();Sync.start(3000)});
</script>
</body>
</html>
